{% extends "base.html" %}
{% block title %}Page Not Found | Dania Amjad{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-card">
    <p class="eyebrow">404</p>
    <h1>Page not found</h1>
    <p>{{ message or "The page you're looking for doesn't exist or was moved." }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return home</a>
  </div>
</div>
{% endblock %}
